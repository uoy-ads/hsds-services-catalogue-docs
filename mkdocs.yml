
site_name: HSDS Catalogue of Services Guide
site_author: Heritage Science Data Service
repo_name: hsds-services-catalogue-docs
site_url: https://github.com/uoy-ads/hsds-services-catalogue-docs/

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/hsds_blue and white.png
  favicon: assets/hsds_notext_blue.png
  features:
    - navigation.sections    # Groups top-level sections in sidebar
    - navigation.instant     # Faster page transitions
    - navigation.top         # Back-to-top button
    - navigation.footer
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: blue grey
      accent: white

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue grey
      accent: deep orange

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - pymdownx.blocks.caption

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/heritage-science-data-service
      name: HSDS LinkedIn
    - icon: simple/bluesky
      link: https://bsky.app/profile/hsds-update.bsky.social
      name: HSDS Bluesky
    - icon: simple/instagram
      link: https://www.instagram.com/heritagescience_dataservice/
      name: HSDS Instagram
copyright: Copyright &copy; 2026 - Heritage Science Data Service

nav:
  - Home: index.md
  - Searching the Catalogue: Section_1a_Searching_HSDS_Services_Catalogue.md
  - Service Pages: Section_1b_Service_Page.md
  - Apply for RICHeS Access: Section_1c_Apply_RICHES_Access.md
  - Publishing Your Service to the Catalogue: 
    - Introduction: Section_2_Service_Users.md
    - Register via UMA: Section_2a_Register_via_UMA.md
    - Log into the Catalogue: Section_2b_Log_into_the_Catalogue.md
    - Create and editing entries: Section_2c_Create_and_Edit_Entries.md
    - Manage tools, metadata and other info: Section_2d_Manage_Entries.md